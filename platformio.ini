; agri-relay-poe — M5Stack AtomS3 Lite + Atomic PoE Base (W5500) + Unit Relay
;                  autonomous single-variable hysteresis relay node.
;
; A generic autonomous relay actuator for the agri-* fleet: it watches ONE value
; (an agriha MQTT topic, with optional UECS-CCM fallback) and drives the M5 Unit
; Relay with a declarative safety envelope — hysteresis, schedule, external gate,
; min on/off dwell, duty limit, max-on watchdog, and fail-safe OFF on stale input.
; Generalizes agri-co2-burner (which is CO2-specific + WiFi) to a PoE node whose
; controlled variable and setpoints are configurable, so it is not tied to a load.
;
; Design: autonomous (keeps running if the Pi4/yasu-hp master dies), but the node
; stays a thin decision+I/O unit — the rule is a single hysteresis primitive, not
; a controller. Remote override via an MQTT command topic; local via the button.
;
; Hardware
;   - M5Stack AtomS3 Lite (ESP32-S3) + M5 Atomic PoE Base (K139, W5500, PoE PD)
;   - M5Stack Unit Relay (U002): 1x SPDT (HK4100F), AC250V/3A or DC30V/3A,
;       Grove HY2.0-4P: Yellow=DIN (control, active HIGH), Red=5V, Black=GND.
;       Plug into the AtomS3 Grove port. DIN = G2 (Grove yellow/SIG) by default;
;       editable in /config. 3.3V logic HIGH triggers the on-unit driver; the
;       relay coil is powered from Grove 5V (supplied by the PoE base).
;   - Status LED = onboard WS2812C on G35 (AtomS3 Lite, not the core's G27).
;   - Button    = onboard on G41 (cycles AUTO / FORCE OFF / FORCE ON).
;
;   W5500 SPI pins on AtomS3 + Atomic PoE Base are SCK=5 / CS=6 / MISO=7 / MOSI=8
;   (NOT the classic ATOM's G22/23/33/19), passed via -DW5500_* below. Same as
;   agri-temp-poe.
;
; Build / upload
;   - First flash over USB-C (native USB CDC). Later flashes over Ethernet via
;     ArduinoOTA (agri-relay-poe-01) or POST /api/ota, or GitHub-release self-update.

[env:m5atoms3-poe]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
	-DCORE_DEBUG_LEVEL=3
	; AtomS3 Lite has no USB-UART chip — Serial is the ESP32-S3 native USB CDC.
	-DARDUINO_USB_CDC_ON_BOOT=1
	; --- W5500 pins: Atomic PoE Base on AtomS3 (same as agri-temp-poe) ---
	-DW5500_SCK=5
	-DW5500_MISO=7
	-DW5500_MOSI=8
	-DW5500_CS=6

lib_deps =
	https://github.com/yasunorioi/agri-node-poe-core.git#v0.7.0
