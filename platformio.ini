; agri-relay-poe — M5Stack AtomS3 Lite + Unit Relay autonomous hysteresis relay.
;
; Two link variants share one firmware:
;   [env:m5atoms3-poe]  (default) — Atomic PoE Base (W5500 Ethernet), PoE powered.
;   [env:m5atoms3-wifi]            — AtomS3 built-in WiFi (-DNET_WIFI), no W5500;
;                                    WiFiManager portal for creds, USB-C/5V powered.
; PoE is preferred in-greenhouse (EMI / reliability); WiFi is for sites without a
; LAN drop. Pick per node: `pio run -e m5atoms3-poe` or `-e m5atoms3-wifi`.
; (house2 variant on either: add -DHOUSE2, see README.)
;
; Hardware / wiring / control model: see README.
;   Unit Relay DIN = G2 (Grove yellow, active HIGH, coil on Grove 5V).
;   LED = G35, button = G41. W5500 (PoE base) = SCK5/CS6/MISO7/MOSI8.

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.38
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags =
	-DCORE_DEBUG_LEVEL=3
	; AtomS3 Lite has no USB-UART chip — Serial is the ESP32-S3 native USB CDC.
	-DARDUINO_USB_CDC_ON_BOOT=1
	; --- W5500 pins: Atomic PoE Base on AtomS3 (ignored by the WiFi build) ---
	-DW5500_SCK=5
	-DW5500_MISO=7
	-DW5500_MOSI=8
	-DW5500_CS=6
lib_deps =
	https://github.com/yasunorioi/agri-node-poe-core.git#v0.7.0

[env:m5atoms3-poe]
; PoE / W5500 Ethernet (default). Nothing extra.

[env:m5atoms3-wifi]
build_flags =
	${env.build_flags}
	-DNET_WIFI
lib_deps =
	${env.lib_deps}
	tzapu/WiFiManager
